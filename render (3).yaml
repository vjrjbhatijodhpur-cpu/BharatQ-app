services:
  - type: web
    name: bharatq-backend-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: bharatq-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: KMS_MASTER_KEY_HEX
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - key: MASTER_TRC20_ADDRESS
        value: TUKdKMmRqpapdSzcQowC2y32cxxHomYEZo
      - key: TRONGRID_API_KEY
        sync: false
      - key: HOT_WALLET_PRIVATE_KEY
        sync: false

  - type: web
    name: bharatq-trading-app
    runtime: static
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: bharatq-postgres-db
    databaseName: bharatq_prod
    user: bharatq_admin
    plan: free